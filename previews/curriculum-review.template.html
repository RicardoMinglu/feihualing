<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>课内诗词校对 · 飞花令</title>
  <style>
    :root{--ink:#25353a;--muted:#617078;--line:#dce3e3;--paper:#fff;--wash:#f4f7f7;--accent:#126b60;--accent-soft:#e9f4f1;--warn:#a14738;--warn-soft:#fff0e9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf1f0;letter-spacing:0}button,input,textarea{font:inherit;letter-spacing:0}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #72aa9f;outline-offset:2px}[hidden]{display:none!important}
    .app{max-width:1120px;margin:0 auto;min-height:100vh;background:var(--paper)}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:18px 28px 14px}.top-row,.toolbar,.tabs,.progress,.item-head,.variant-head,.missing-row{display:flex;align-items:center;gap:12px}.top-row{justify-content:space-between;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;min-width:0}.seal{width:30px;height:30px;display:grid;place-items:center;background:var(--warn);color:white;font:19px "Songti SC",serif;border-radius:2px}.brand h1{margin:0;font-size:20px;font-weight:650;line-height:1.25}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:3px}.toolbar{justify-content:flex-end;flex-wrap:wrap}.command{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#fff;font-size:12px}.command:hover{background:var(--wash)}.command svg,.source-link svg{width:15px;height:15px}.command.primary{background:var(--accent);border-color:var(--accent);color:white}.command.primary:hover{background:#0d5a51}.control-row{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:18px}.tabs{gap:3px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:8px 13px 11px;color:var(--muted);font-size:13px;white-space:nowrap;border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--accent);font-weight:600;border-color:var(--accent)}.search{width:min(300px,100%);height:36px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--wash);color:var(--ink);font-size:12px;min-width:0}.progress{color:var(--muted);font-size:12px;margin-top:11px;gap:8px}.progress strong{color:var(--accent);font-size:14px}.bar{width:100px;height:5px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.content{padding:0 28px 32px}.review-item{padding:28px 0 30px;border-bottom:1px solid var(--line)}.item-head{justify-content:space-between;align-items:flex-start;margin-bottom:17px;gap:14px}.item-head h2{font-size:20px;font-weight:600;margin:0 0 6px}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.badge{display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);padding:3px 6px;border-radius:3px;font-size:11px}.badge.warn{background:var(--warn-soft);color:var(--warn)}.source-link{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;margin-top:5px}.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.variant{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0;overflow:hidden;cursor:pointer}.variant:hover{border-color:#91bcb3}.variant:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#fcfefd}.variant input[type=radio]{position:absolute;left:13px;top:14px;width:18px;height:18px;accent-color:var(--accent);margin:0;z-index:1}.variant-head{padding:12px 12px 10px 39px;align-items:baseline;min-height:59px;border-bottom:1px solid var(--line);gap:6px;flex-wrap:wrap}.variant-head strong{font-size:13px;font-weight:600}.variant-head small{font-size:10px;color:var(--muted)}.poem{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:18px;line-height:1.85;white-space:pre-line;overflow-wrap:anywhere;padding:13px;min-height:132px;flex:1}mark{background:var(--warn-soft);color:var(--warn);padding:0 1px}.variant-source{border-top:1px solid var(--line);padding:10px 12px;color:var(--muted);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.variant-source a{display:inline-block;margin-top:4px}.custom-text{display:block;width:calc(100% - 24px);min-height:110px;resize:vertical;margin:12px;border:1px solid var(--line);border-radius:4px;padding:9px;font-size:14px;line-height:1.6;background:#fff;color:var(--ink)}.variant .custom-text:not([hidden]){cursor:text}.review-footer{display:flex;align-items:center;gap:15px;margin-top:15px}.defer{display:inline-flex;gap:7px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer}.defer input{accent-color:var(--accent)}.note-input{flex:1;max-width:470px;min-width:0;border:0;border-bottom:1px solid var(--line);padding:7px 2px;color:var(--ink);background:transparent;font-size:12px}.note-input::placeholder{color:#879397}.missing-list{padding:11px 0}.missing-row{justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:13px 0}.missing-main{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}.missing-main strong{font-weight:600;font-size:14px}.missing-main span{font-size:12px;color:var(--muted)}.empty{padding:50px 0;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);border-radius:4px;background:var(--ink);color:#fff;padding:10px 15px;font-size:12px;z-index:10;box-shadow:0 8px 30px #21383b30}.fallback{position:fixed;inset:0;z-index:12;background:#1e2b2c75;display:grid;place-items:center;padding:20px}.fallback-panel{width:min(640px,100%);background:#fff;padding:20px;border-radius:6px}.fallback-panel h2{font-size:17px;margin:0 0 12px}.fallback-panel textarea{width:100%;min-height:180px;max-height:50vh;resize:vertical;border:1px solid var(--line);padding:9px;font:12px/1.5 monospace}.fallback-panel .command{margin-top:10px}.footer{font-size:11px;color:var(--muted);padding:16px 28px 30px}
    @media(max-width:700px){.top{padding:14px 18px 12px}.content{padding:0 18px 20px}.footer{padding:12px 18px 24px}.brand h1{font-size:18px}.toolbar{justify-content:flex-start;width:100%}.control-row{margin-top:12px;align-items:stretch;flex-direction:column;gap:10px}.tabs{width:100%}.tab{flex:1}.search{width:100%}.review-item{padding:23px 0}.item-head{align-items:flex-start}.item-head h2{font-size:18px}.variants{grid-template-columns:1fr}.poem{min-height:0;font-size:18px}.review-footer{flex-wrap:wrap}.note-input{flex-basis:100%}.bar{width:65px}}
    @media(prefers-reduced-motion:reduce){.bar i{transition:none}}
  </style>
  <script src="../static/assets/lucide.min.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand"><span class="seal">令</span><h1>课内诗词校对<small>飞花令 · 版本选择</small></h1></div>
        <div class="toolbar">
          <button class="command" id="copy-decisions" type="button"><i data-lucide="copy"></i>复制决定</button>
          <button class="command primary" id="export-decisions" type="button"><i data-lucide="download"></i>导出 JSON</button>
        </div>
      </div>
      <div class="control-row">
        <div class="tabs" role="tablist" aria-label="校对列表">
          <button class="tab" id="tab-ambiguous" role="tab" aria-selected="true" type="button">版本待定 <span id="ambiguous-count"></span></button>
          <button class="tab" id="tab-missing" role="tab" aria-selected="false" type="button">诗库缺失 <span id="missing-count"></span></button>
        </div>
        <input class="search" id="filter" type="search" aria-label="查找篇目" placeholder="查找篇名、作者或册次" autocomplete="off">
      </div>
      <div class="progress" id="progress" aria-live="polite"><strong id="decided-count">0</strong><span id="progress-total"></span><span class="bar"><i id="progress-fill"></i></span></div>
    </header>
    <main class="content" id="content"></main>
    <footer class="footer">来源：人教社电子教材目录、原诗库与逐项列明的文字资料。所选版本仍需按教材正文复核后入库。</footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="fallback" id="fallback" hidden>
    <div class="fallback-panel" role="dialog" aria-modal="true" aria-label="复制校对决定">
      <h2>校对决定</h2><textarea id="fallback-text" aria-label="校对决定内容"></textarea>
      <button class="command" id="close-fallback" type="button">关闭</button>
    </div>
  </div>
  <script type="application/json" id="review-data"><!-- REVIEW_DATA --></script>
  <script>
    (() => {
      'use strict';
      const data=JSON.parse(document.getElementById('review-data').textContent);
      const storageKey='feihualing.curriculum-review.v1.'+data.report_sha256.slice(0,16);
      const labels={primary:'小学',junior:'初中',senior:'高中'};
      const root=document.getElementById('content');
      const filter=document.getElementById('filter');
      const choices=readChoices();
      let view='ambiguous';
      let toastTimer;
      function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function readChoices(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}
      function save(){try{localStorage.setItem(storageKey,JSON.stringify(choices))}catch{toast('浏览器未保存选择，请导出 JSON')}}
      function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3300)}
      function chosen(issue){const choice=choices[issue.key];return !!(choice&&(choice.kind==='candidate'||choice.kind==='custom'&&choice.text?.trim()))}
      function updateProgress(){const count=data.ambiguous.filter(chosen).length;document.getElementById('decided-count').textContent=count;document.getElementById('progress-total').textContent=`/ ${data.ambiguous.length} 处已选择`;document.getElementById('progress-fill').style.width=(data.ambiguous.length?100*count/data.ambiguous.length:0)+'%'}
      function icon(){window.lucide?.createIcons({attrs:{'aria-hidden':'true'}})}
      function issueHtml(issue,index){const choice=choices[issue.key]||{};const candidates=issue.variants.map((variant,n)=>`<label class="variant"><input type="radio" name="choice-${index}" data-key="${esc(issue.key)}" data-value="${esc(variant.id)}" ${choice.kind==='candidate'&&choice.id===variant.id?'checked':''}><span class="variant-head"><strong>${variant.id.startsWith('reference:')?'公开参考版本':'库内版本 '+String.fromCharCode(65+n)}</strong><small>${esc(variant.title)}</small></span><span class="poem">${variant.diff_html}</span><span class="variant-source">${esc(variant.source)}${variant.source_url?`<br><a href="${esc(variant.source_url)}" target="_blank" rel="noopener noreferrer">查看文字来源 <i data-lucide="arrow-up-right"></i></a>`:''}</span></label>`).join('');return `<section class="review-item" data-search="${esc((issue.title+' '+issue.author+' '+issue.volume).toLowerCase())}" data-key="${esc(issue.key)}"><div class="item-head"><div><h2>${esc(issue.title)}</h2><div class="meta"><span class="badge">${labels[issue.stage]}</span><span>${esc(issue.volume)}</span><span>·</span><span>${esc(issue.author)}</span><span class="badge warn">${issue.variants.length} 种写法</span></div></div><a class="source-link" href="${esc(issue.book_url)}" target="_blank" rel="noopener noreferrer">查看教材 <i data-lucide="arrow-up-right"></i></a></div><div class="variants">${candidates}<label class="variant"><input type="radio" name="choice-${index}" data-key="${esc(issue.key)}" data-value="custom" ${choice.kind==='custom'?'checked':''}><span class="variant-head"><strong>以上都不对</strong><small>填写另一种写法</small></span><textarea class="custom-text" data-custom="${esc(issue.key)}" aria-label="${esc(issue.title)}的另一种写法" placeholder="完整诗文" ${choice.kind==='custom'?'':'hidden'}>${esc(choice.text||'')}</textarea><span class="variant-source">待根据教材正文核实</span></label></div><div class="review-footer"><label class="defer"><input type="radio" name="choice-${index}" data-key="${esc(issue.key)}" data-value="defer" ${choice.kind!=='candidate'&&choice.kind!=='custom'?'checked':''}>暂不决定</label><input class="note-input" data-note="${esc(issue.key)}" aria-label="${esc(issue.title)}备注" placeholder="备注（可选）" value="${esc(choice.note||'')}"></div></section>`}
      function missingHtml(item){return `<div class="missing-row" data-search="${esc((item.title+' '+item.author+' '+item.volume).toLowerCase())}"><div class="missing-main"><strong>${esc(item.title)}</strong><span>${esc(item.author)} · ${esc(item.volume)}</span></div><a class="source-link" href="${esc(item.book_url)}" target="_blank" rel="noopener noreferrer">教材 <i data-lucide="arrow-up-right"></i></a></div>`}
      function render(){document.getElementById('ambiguous-count').textContent=data.ambiguous.length;document.getElementById('missing-count').textContent=data.missing.length;document.getElementById('tab-ambiguous').setAttribute('aria-selected',String(view==='ambiguous'));document.getElementById('tab-missing').setAttribute('aria-selected',String(view==='missing'));root.innerHTML=view==='ambiguous'?data.ambiguous.map(issueHtml).join(''):'<div class="missing-list">'+data.missing.map(missingHtml).join('')+'</div>';applyFilter();updateProgress();icon()}
      function applyFilter(){const q=filter.value.trim().toLowerCase();let visible=0;root.querySelectorAll('[data-search]').forEach(el=>{el.hidden=!!q&&!el.dataset.search.includes(q);if(!el.hidden)visible++});root.querySelector('.empty')?.remove();if(!visible)root.insertAdjacentHTML('beforeend','<div class="empty">没有匹配的篇目</div>')}
      function exportData(){const decisions=[];for(const issue of data.ambiguous){const choice=choices[issue.key];if(!choice||choice.kind==='defer')continue;if(choice.kind==='custom'&&!choice.text?.trim()){toast('自拟版本还没有正文：'+issue.title);return null}const record={book_id:issue.book_id,volume:issue.volume,stage:issue.stage,title:issue.title,author:issue.author,kind:choice.kind,note:choice.note||''};if(choice.kind==='candidate'){const variant=issue.variants.find(item=>item.id===choice.id);if(!variant)continue;record.version_id=variant.id;record.source=variant.source;record.source_url=variant.source_url||null;record.paragraphs=variant.paragraphs}else record.text=choice.text.trim();decisions.push(record)}return {schema_version:1,report_sha256:data.report_sha256,decisions}}
      document.getElementById('tab-ambiguous').addEventListener('click',()=>{view='ambiguous';render()});document.getElementById('tab-missing').addEventListener('click',()=>{view='missing';render()});filter.addEventListener('input',applyFilter);
      root.addEventListener('change',event=>{const control=event.target;if(!control.matches('[data-value]'))return;const key=control.dataset.key;const old=choices[key]||{};const value=control.dataset.value;choices[key]=value==='defer'?{kind:'defer',note:old.note||''}:value==='custom'?{kind:'custom',text:old.text||'',note:old.note||''}:{kind:'candidate',id:value,note:old.note||''};const field=root.querySelector(`[data-custom="${CSS.escape(key)}"]`);if(field)field.hidden=value!=='custom';save();updateProgress();if(value==='custom')field?.focus()});
      root.addEventListener('input',event=>{const field=event.target;if(field.dataset.custom){const entry=choices[field.dataset.custom]||{kind:'custom'};entry.text=field.value;choices[field.dataset.custom]=entry;save();updateProgress()}if(field.dataset.note){const entry=choices[field.dataset.note]||{kind:'defer'};entry.note=field.value;choices[field.dataset.note]=entry;save()}});
      document.getElementById('export-decisions').addEventListener('click',()=>{const exported=exportData();if(!exported)return;const blob=new Blob([JSON.stringify(exported,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='feihualing-curriculum-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${exported.decisions.length} 条决定`)});
      document.getElementById('copy-decisions').addEventListener('click',async()=>{const exported=exportData();if(!exported)return;const text=JSON.stringify(exported,null,2);try{await navigator.clipboard.writeText(text);toast(`已复制 ${exported.decisions.length} 条决定`)}catch{const panel=document.getElementById('fallback');const area=document.getElementById('fallback-text');area.value=text;panel.hidden=false;area.focus();area.select()}});
      document.getElementById('close-fallback').addEventListener('click',()=>document.getElementById('fallback').hidden=true);
      document.addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('fallback').hidden=true});
      render();
      window.addEventListener('load',icon);
    })();
  </script>
</body>
</html>
